server {
  listen 80;
  listen [::]:80;
  server_name beta.nofan.xyz;
  root /var/www/beta-acme;
  location ^~ /.well-known/acme-challenge/ { allow all; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name beta.nofan.xyz;
  ssl_certificate /etc/letsencrypt-beta/live/beta.nofan.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt-beta/live/beta.nofan.xyz/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 99m;
  include /etc/nginx/snippets/nofan-beta-realip.conf;
  add_header Strict-Transport-Security 'max-age=31536000' always;
  add_header X-Robots-Tag 'noindex, nofollow' always;

  location / {
    proxy_pass http://127.0.0.1:3105;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Proxy '';
    proxy_read_timeout 90s;
    proxy_http_version 1.1;
  }

  location ^~ /api/v1/streaming {
    proxy_pass http://127.0.0.1:4105;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 86400s;
  }
}
