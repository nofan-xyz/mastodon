# Public, content-hashed frontend assets only. Never enable this zone on / or /api/.
proxy_cache_path /var/cache/nginx/banfan-static levels=1:2 keys_zone=banfan_static:16m max_size=2g inactive=30d use_temp_path=off;
map $upstream_status $banfan_static_skip_status {
    default 1;
    200 0;
}
log_format banfan_static_cache '$time_iso8601 port=$server_port $request_method $uri status=$status cache=$upstream_cache_status request_time=$request_time upstream_time=$upstream_response_time bytes=$body_bytes_sent';
