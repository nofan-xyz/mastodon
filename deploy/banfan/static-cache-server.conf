# Cookie/auth headers are stripped only for immutable, public build artifacts.
location ~ "^/packs/(?:[A-Za-z0-9_.-]+/)*[A-Za-z0-9_.-]+-[A-Za-z0-9_-]{6,}\.(?:js|css|woff2?|ttf|otf|wasm)$" {
    proxy_pass https://$nofan_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host nofan.xyz;
    proxy_ssl_server_name on;
    proxy_ssl_name nofan.xyz;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Proxy "";
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_cache banfan_static;
    proxy_cache_key "nofan.xyz$uri$is_args$args";
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 28d;
    proxy_no_cache $banfan_static_skip_status;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_revalidate on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    # Keep upstream Cache-Control, Vary, Set-Cookie and private/no-store semantics.
    add_header X-BanFan-Static-Cache $upstream_cache_status always;
    access_log /var/log/nginx/ban.fan.static-cache.log banfan_static_cache;
}
